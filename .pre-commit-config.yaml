# pre-commit: fast checks on staged files before each commit.
# Install once:  pipx install pre-commit && pre-commit install   (or: uv tool install pre-commit)
# Run on everything:  pre-commit run --all-files
# Skip in an emergency:  git commit --no-verify   (the project's own checks still apply: make ci)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: detect-private-key
        
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (errors only)
        entry: shellcheck --severity=error
        language: system
        types: [shell]
        exclude: ^vendor/
      - id: check-version
        name: Version consistency
        entry: scripts/check-version.sh
        language: system
        pass_filenames: false
        files: ^(velox\.pro|CHANGELOG\.md|packaging/)
