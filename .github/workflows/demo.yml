name: Demo

# Renders docs/demo.gif from the real editor. Run it by hand, then download the
# artifact: gh run download <id> -n demo
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel qt5-base qt5-svg git ffmpeg ttf-jetbrains-mono inter-font fontconfig

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with the demo script
        run: DEMO=1 SELFTEST=0 JOBS=$(nproc) ./build.sh

      - name: Render frames and GIF
        run: |
          fc-list | grep -Ei "jetbrains|inter" | head -5
          docs/make-demo.sh frames

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo
          path: |
            docs/demo.gif
            frames/frame_*.png
