name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch (Qt 5)
            qt: 5
            packages: qt5-base qt5-svg
          - name: Arch (Qt 6)
            qt: 6
            packages: qt6-base qt6-svg qt6-5compat
          # Catches memory errors and undefined behavior, which the C++ code
          # (and the Scintilla it embeds) would otherwise only show in the field.
          - name: Arch (Qt 5, ASan + UBSan)
            qt: 5
            packages: qt5-base qt5-svg
            sanitize: 1
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel ${{ matrix.packages }} desktop-file-utils appstream git

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check version consistency
        run: scripts/check-version.sh

      - name: Build
        env:
          QT: ${{ matrix.qt }}
          SANITIZE: ${{ matrix.sanitize || 0 }}
        run: JOBS=$(nproc) ./build.sh

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./run.sh --self-test

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/io.github.DakodaStemen.Velox.desktop
          appstreamcli validate --no-net packaging/io.github.DakodaStemen.Velox.metainfo.xml

      - name: Production build has no test suite
        run: |
          rm -rf build vendor/lexilla/bin/*.a
          SELFTEST=0 JOBS=$(nproc) ./build.sh
          if QT_QPA_PLATFORM=offscreen build/app/bin/velox --self-test 2>&1 | grep -q "Unknown option"; then
            echo "self-test correctly absent"
          else
            echo "::error::--self-test is present in a SELFTEST=0 build"; exit 1
          fi

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev qtbase5-dev-tools libqt5svg5-dev

      - name: Build
        run: JOBS=$(nproc) ./build.sh

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./run.sh --self-test
