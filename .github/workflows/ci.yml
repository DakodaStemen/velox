name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel qt5-base qt5-svg desktop-file-utils appstream git

      - uses: actions/checkout@v4

      - name: Build
        run: JOBS=$(nproc) ./build.sh

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./run.sh --self-test

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/io.github.DakodaStemen.Velox.desktop
          appstreamcli validate --no-net packaging/io.github.DakodaStemen.Velox.metainfo.xml
