name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch (Qt 5)
            qt: 5
            packages: qt5-base qt5-svg
          - name: Arch (Qt 6)
            qt: 6
            packages: qt6-base qt6-svg qt6-5compat
          # Catches memory errors and undefined behavior, which the C++ code
          # (and the Scintilla it embeds) would otherwise only show in the field.
          - name: Arch (Qt 5, ASan + UBSan)
            qt: 5
            packages: qt5-base qt5-svg
            sanitize: 1
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel ${{ matrix.packages }} desktop-file-utils appstream git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version consistency
        run: scripts/check-version.sh

      - name: Build
        env:
          QT: ${{ matrix.qt }}
          SANITIZE: ${{ matrix.sanitize || 0 }}
        run: JOBS=$(nproc) ./build.sh

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./run.sh --self-test

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/io.github.DakodaStemen.Velox.desktop
          appstreamcli validate --no-net packaging/io.github.DakodaStemen.Velox.metainfo.xml

      - name: Production build has no test suite
        env:
          QT: ${{ matrix.qt }}
        run: |
          rm -rf build vendor/lexilla/bin/*.a
          SELFTEST=0 JOBS=$(nproc) ./build.sh
          if QT_QPA_PLATFORM=offscreen build/app/bin/velox --self-test 2>&1 | grep -q "Unknown option"; then
            echo "self-test correctly absent"
          else
            echo "::error::--self-test is present in a SELFTEST=0 build"; exit 1
          fi

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev qtbase5-dev-tools libqt5svg5-dev

      - name: Build
        run: JOBS=$(nproc) ./build.sh

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./run.sh --self-test

  # Cross-platform CMake build + test + package on the three desktop OSes.
  cmake:
    name: CMake (${{ matrix.os }}, Qt ${{ matrix.qt }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt: 6.8.*
            arch: linux_gcc_64
          - os: windows-latest
            qt: 6.8.*
            arch: win64_msvc2022_64
          # Qt 6.8.3 links the AGL framework, which newer Xcode SDKs removed.
          - os: macos-latest
            qt: 6.9.*
            arch: clang_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          modules: qt5compat
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build rpm libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 desktop-file-utils appstream

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install ninja nsis --no-progress -y

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0

      - name: Check version consistency
        shell: bash
        run: scripts/check-version.sh

      - name: Configure
        shell: bash
        run: cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DVELOX_SELFTEST=ON

      - name: Build
        run: cmake --build build-cmake --parallel

      - name: Test
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-cmake --output-on-failure

      # ctest swallows the console output of this exe on Windows runners, so
      # run it directly and print the log.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          code=0; ./build-cmake/velox.exe --self-test > selftest.log 2>&1 || code=$?
          cat selftest.log; exit $code

      - name: Validate desktop metadata
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/io.github.DakodaStemen.Velox.desktop
          appstreamcli validate --no-net packaging/io.github.DakodaStemen.Velox.metainfo.xml

      - name: Production configure (no test suite) and package
        shell: bash
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DVELOX_SELFTEST=OFF
          cmake --build build-release --parallel
          cd build-release && cpack

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velox-${{ runner.os }}
          path: |
            build-release/velox-*.exe
            build-release/velox-*.zip
            build-release/velox-*.dmg
            build-release/velox-*.deb
            build-release/velox-*.rpm
            build-release/velox-*.tar.gz
          if-no-files-found: error
