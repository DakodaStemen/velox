name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel qt5-base qt5-svg desktop-file-utils appstream git

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check version consistency
        run: scripts/check-version.sh

      - name: Build
        run: JOBS=$(nproc) ./build.sh

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./run.sh --self-test

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/io.github.DakodaStemen.Velox.desktop
          appstreamcli validate --no-net packaging/io.github.DakodaStemen.Velox.metainfo.xml

      - name: Production build has no test suite
        run: |
          rm -rf build vendor/lexilla/bin/*.a
          SELFTEST=0 JOBS=$(nproc) ./build.sh
          if QT_QPA_PLATFORM=offscreen build/app/bin/velox --self-test 2>&1 | grep -q "Unknown option"; then
            echo "self-test correctly absent"
          else
            echo "::error::--self-test is present in a SELFTEST=0 build"; exit 1
          fi

  sanitizers:
    # Not yet verified green; findings are reported but do not block until triaged.
    runs-on: ubuntu-latest
    container: archlinux:latest
    continue-on-error: true
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel qt5-base qt5-svg git

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build with ASan + UBSan
        run: SANITIZE=1 JOBS=$(nproc) ./build.sh

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./run.sh --self-test

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev qtbase5-dev-tools libqt5svg5-dev

      - name: Build
        run: JOBS=$(nproc) ./build.sh

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./run.sh --self-test
