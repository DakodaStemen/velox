name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the steps to reproduce and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Velox version
      description: Output of `velox --version`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      placeholder: e.g. Arch Linux, KDE Plasma 6 (Wayland)
  - type: textarea
    id: extra
    attributes:
      label: Sample file, logs or screenshots
      description: Attach a small file if the problem depends on content or encoding.
